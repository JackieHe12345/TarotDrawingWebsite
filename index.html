<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17141f" />
  <meta name="description" content="快速抽取一张或三张塔罗牌，也可自选 1–10 张。查看每张牌对应的正逆位关键词与解读。" />
  <title>塔罗牌自动抽牌 · 此刻的指引</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="tarot-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-star" viewBox="0 0 40 40"><path d="m20 3 4.5 12.5L37 20l-12.5 4.5L20 37l-4.5-12.5L3 20l12.5-4.5Z"/><circle cx="20" cy="20" r="4"/></symbol>
    <symbol id="icon-wand" viewBox="0 0 40 40"><path d="m11 33 18-26M15 27l-6-6m15-7 7 1M20 20l-2-9M27 8l4-2-1 5"/></symbol>
    <symbol id="icon-cup" viewBox="0 0 40 40"><path d="M10 7h20v9a10 10 0 0 1-20 0ZM20 26v8m-7 0h14M10 10H5v6a6 6 0 0 0 7 6m18-12h5v6a6 6 0 0 1-7 6"/></symbol>
    <symbol id="icon-sword" viewBox="0 0 40 40"><path d="M20 3 15 12v14h10V12ZM20 9v17M10 26h20M20 26v10m-4 0h8"/></symbol>
    <symbol id="icon-coin" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="m20 9 3 8h9l-7 5 3 9-8-6-8 6 3-9-7-5h9Z"/></symbol>
  </svg>
  <main class="app">
    <header class="header">
      <div class="brand"><svg aria-hidden="true"><use href="#icon-star"/></svg><span>TAROT <span class="brand-divider">/</span> 此刻的指引</span></div>
      <h1>塔罗牌自动抽牌</h1>
      <p class="subtitle">静下心，想一个问题。<br class="mobile-break" />给此刻留一点新的启发。</p>
    </header>
    <section class="draw-panel" aria-label="选择抽牌方式">
      <div class="section-caption"><span>从一张牌开始</span><span class="caption-star" aria-hidden="true">✦</span></div>
      <div class="quick-actions">
        <button type="button" class="quick-draw" id="quickOne" aria-label="快速抽 1 张">
          <span class="mini-deck single" aria-hidden="true"><span>✦</span></span>
          <span class="quick-copy"><strong>快速抽 1 张</strong><span>一个当下的灵感</span></span>
          <span class="quick-arrow" aria-hidden="true">↗</span>
        </button>
        <button type="button" class="quick-draw" id="quickThree" aria-label="快速抽 3 张">
          <span class="mini-deck triple" aria-hidden="true"><span></span><span>✦</span><span></span></span>
          <span class="quick-copy"><strong>快速抽 3 张</strong><span>多一点思考的角度</span></span>
          <span class="quick-arrow" aria-hidden="true">↗</span>
        </button>
      </div>
      <details class="custom-draw">
        <summary><span>自选抽牌张数</span><span class="custom-range">1–10 张 <span aria-hidden="true">＋</span></span></summary>
        <form id="drawForm" novalidate>
          <div class="input-group"><label for="cardCount">抽取张数</label><input id="cardCount" name="cardCount" type="number" inputmode="numeric" min="1" max="10" step="1" value="3" required aria-describedby="countHint errorMsg" /><span id="countHint">1–10 张</span></div>
          <button type="submit" id="drawBtn" class="primary-btn">开始抽牌 <span aria-hidden="true">→</span></button>
        </form>
      </details>
      <p id="errorMsg" class="error" role="alert" hidden></p>
      <p class="deck-note">78 张完整牌组<span>·</span>每次不重复<span>·</span>随机正逆位</p>
    </section>
    <section class="result-area" id="results" aria-labelledby="resultHeading" tabindex="-1">
      <div class="result-header"><h2 id="resultHeading">你的牌面</h2><button type="button" id="clearBtn" class="text-btn" hidden>清空结果</button></div>
      <p class="notice" id="noticeText" role="status" aria-live="polite" aria-atomic="true">选择一种抽牌方式，看看此刻的启发。</p>
      <div class="empty-state" id="emptyState">
        <div class="empty-cards" aria-hidden="true"><span></span><span><svg><use href="#icon-star"/></svg></span><span></span></div>
        <p>答案，从你的第一张牌开始</p>
        <span>抽牌后，在这里阅读每张牌的正逆位含义</span>
      </div>
      <div class="cards" id="cardsContainer"></div>
      <div class="result-footer" id="resultFooter" hidden><p class="timestamp" id="timestamp"></p><button type="button" id="redrawBtn" class="secondary-btn">再抽一次 <span aria-hidden="true">↻</span></button></div>
    </section>
    <footer class="page-footer"><span aria-hidden="true">✦</span> 留一点时间，听听自己的想法 <span aria-hidden="true">✦</span></footer>
    <noscript><p class="error">请启用浏览器的 JavaScript 后使用抽牌功能。</p></noscript>
  </main>
</body>
</html>
